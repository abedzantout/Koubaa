name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: KobaaTV_Project_Final
      run: |
        # في حال عدم وجود ملف الجرادل الرئيسي سيتم توليده تلقائياً
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build with Gradle
      working-directory: KobaaTV_Project_Final
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: KobaaTV-APK
        path: KobaaTV_Project_Final/app/build/outputs/apk/debug/*.apk


