name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip Project Files
      run: |
        # هنا سيقوم السيرفر بفك ضغط ملفك تلقائياً، تأكد أن الاسم يطابق اسم ملف الـ ZIP المرفوع
        unzip *.zip 
        
    - name: Grant execute permission for gradlew
      run: |
        # البحث عن ملف التشغيل وإعطائه صلاحية الصيانة
        chmod +x ./gradlew || chmod +x **/gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug || (cd *Project* && ./gradlew assembleDebug)

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: KobaaTV-APK
        path: "**/build/outputs/apk/debug/*.apk"
